name: Binaries

on:
  pull_request:
    branches: [master]
  workflow_call:
    inputs:
      release-tag:
        description: >-
          Tag of the (possibly draft) GitHub release to check out, build,
          and upload binaries to. If empty, binaries are still built for
          validation but not uploaded anywhere.
        required: false
        type: string
        default: ""
      skip-amd64:
        required: false
        type: boolean
        default: false
      skip-arm64:
        required: false
        type: boolean
        default: false
      skip-armv6:
        required: false
        type: boolean
        default: false
      skip-ppc64le:
        required: false
        type: boolean
        default: false
      skip-riscv64:
        required: false
        type: boolean
        default: false
      skip-s390x:
        required: false
        type: boolean
        default: false

permissions: {}

jobs:
  create-binaries:
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      matrix:
        goos: [linux]
        # Pull request runs are just a test to check that everything still
        # compiles, so amd64 and arm64 are sufficient.
        goarch: ${{ github.event_name == 'pull_request' && fromJSON('["amd64","arm64"]') || fromJSON('["amd64","arm64","armv6","ppc64le","riscv64","s390x"]') }}

    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
      with:
        persist-credentials: false
        fetch-depth: 0
        ref: ${{ inputs.release-tag }}

    - name: Set up Go
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
      with:
        go-version-file: "go.mod"
        cache: false

    - name: Determine release tag
      id: release
      run: echo "tag=${{ inputs.release-tag }}" >> "$GITHUB_OUTPUT"

    # Skip this architecture if it was explicitly requested via input, or
    # (idempotency) if it's already attached to the release -- e.g. a
    # previous run of this workflow already uploaded it, and we're only
    # re-running to pick up a different architecture that failed.
    - name: Check if this architecture should be skipped
      id: check
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        TAG: ${{ steps.release.outputs.tag }}
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        SKIP_ARCH: ${{ inputs[format('skip-{0}', matrix.goarch)] }}
      run: |
        set -eu
        if [[ "$SKIP_ARCH" == "true" ]]; then
          echo "Architecture $GOARCH skipped via input."
          echo "skip=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        if [[ -n "$TAG" ]]; then
          PATTERN="pebble_${TAG}_${GOOS}_${GOARCH}.tar.gz"
          if gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qxF "$PATTERN"; then
            echo "Archive $PATTERN already attached to release $TAG, skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
        fi

        echo "skip=false" >> "$GITHUB_OUTPUT"

    - name: Build binary and create archive
      id: build
      if: steps.check.outputs.skip != 'true'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: "0"
      run: |
        echo Generating version file
        go generate ./cmd

        # If GOARCH is armvN (e.g. armv6, armv5), set GOARCH=arm and GOARM=N
        if [[ "$GOARCH" == armv* ]]; then
          export GOARM="${GOARCH#armv}"
          export GOARCH=arm
          echo Using GOARM=$GOARM
        fi

        echo Building for $GOOS $GOARCH
        go build -trimpath -ldflags='-s -w' -o dist/build/pebble ./cmd/pebble

        # Get version via "pebble version" to ensure it matches that exactly
        PEBBLE_VERSION=$(GOOS=linux GOARCH=amd64 go run ./cmd/pebble version --client)

        ARCHIVE_FILE=pebble_${PEBBLE_VERSION}_${GOOS}_${GOARCH}.tar.gz
        echo Creating archive $ARCHIVE_FILE
        cp COPYING dist/build
        cp README.md dist/build
        tar -czf dist/$ARCHIVE_FILE -C dist/build $(ls -A dist/build)

        # Share variables with subsequent steps
        echo "ARCHIVE_FILE=${ARCHIVE_FILE}" >>$GITHUB_OUTPUT
        echo "PEBBLE_VERSION=${PEBBLE_VERSION}" >>$GITHUB_OUTPUT

    - name: Attest build provenance
      if: steps.check.outputs.skip != 'true' && steps.release.outputs.tag != ''
      uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
      with:
        subject-path: dist/${{ steps.build.outputs.ARCHIVE_FILE }}

    - name: Upload archive as Actions artifact
      if: steps.check.outputs.skip != 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
      with:
        name: ${{ steps.build.outputs.ARCHIVE_FILE }}
        path: dist/${{ steps.build.outputs.ARCHIVE_FILE }}

    - name: Upload archive to release
      env:
        ARCHIVE_FILE: ${{ steps.build.outputs.ARCHIVE_FILE }}
        TAG: ${{ steps.release.outputs.tag }}
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      if: steps.check.outputs.skip != 'true' && steps.release.outputs.tag != ''
      run: |
        echo Uploading $ARCHIVE_FILE to release $TAG
        gh release upload "$TAG" "dist/$ARCHIVE_FILE"
