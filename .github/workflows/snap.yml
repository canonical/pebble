name: Pebble snap

# Channel strategy:
#   - push to master: builds and publishes straight to latest/edge, as a
#     continuous "this is what's on master right now" channel.
#   - called from release.yml (workflow_call): builds and publishes straight to
#     latest/candidate for the version being released, or fips/candidate if
#     the release tag ends in "-fips".
#   - a GitHub release is published: promotes the already-published
#     candidate build to stable, on the same track (latest or fips, again
#     based on whether the release tag ends in "-fips"). This never
#     (re)builds anything, it assumes release.yml already published the
#     candidate for that release.
#   - pull_request: just a test build (see local-build below), never published.

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  release:
    types: [published]
  workflow_call:
    inputs:
      release-tag:
        description: >-
          Tag of the (possibly draft) GitHub release to check out, build,
          and upload the built snap to.
        required: false
        type: string
        default: ""
      dry-run-snap-publish:
        description: >-
          Build, test, and upload snaps as normal, but don't actually
          publish/promote them on the Snap Store (the `snapcraft release`
          and snapcore/action-publish steps become no-ops).
        required: false
        type: boolean
        default: false
      skip-build:
        description: "Skip building/publishing snaps entirely"
        required: false
        type: boolean
        default: false
      skip-amd64:
        required: false
        type: boolean
        default: false
      skip-arm64:
        required: false
        type: boolean
        default: false
      skip-armhf:
        required: false
        type: boolean
        default: false
      skip-ppc64el:
        required: false
        type: boolean
        default: false
      skip-riscv64:
        required: false
        type: boolean
        default: false
      skip-s390x:
        required: false
        type: boolean
        default: false
      qemu-amd64:
        description: >-
          Build the amd64 snap locally inside a QEMU-emulated VM instead of
          via Launchpad's remote-build service.
        required: false
        type: boolean
        default: false
      qemu-arm64:
        description: >-
          Build the arm64 snap locally inside a QEMU-emulated VM instead of
          via Launchpad's remote-build service.
        required: false
        type: boolean
        default: false
      qemu-armhf:
        description: >-
          Build the armhf snap locally inside a QEMU-emulated VM instead of
          via Launchpad's remote-build service.
        required: false
        type: boolean
        default: false
      qemu-ppc64el:
        description: >-
          Build the ppc64el snap locally inside a QEMU-emulated VM instead
          of via Launchpad's remote-build service.
        required: false
        type: boolean
        default: false
      qemu-riscv64:
        description: >-
          Build the riscv64 snap locally inside a QEMU-emulated VM instead
          of via Launchpad's remote-build service.
        required: false
        type: boolean
        default: false
      qemu-s390x:
        description: >-
          Build the s390x snap locally inside a QEMU-emulated VM instead of
          via Launchpad's remote-build service.
        required: false
        type: boolean
        default: false
    secrets:
      LP_CREDENTIALS:
        description: "Launchpad credentials used for the remote snap build"
        required: true
      PEBBLE_DEV_MAILING_LIST:
        description: "Mailing list address notified of remote build results"
        required: true
      SNAPCRAFT_STORE_CREDENTIALS:
        description: "Snapcraft Store credentials used to publish/promote the snap"
        required: true

permissions: {}

# We don't want this workflow to have multiple runs in parallel because
# what could happen is that a slow-running and older execution will upload
# an older snap to `edge`, after the newer and latest snap has already been released.
concurrency: ${{ github.workflow }}-${{ github.ref }}

env:
  DEFAULT_TRACK: latest
  EDGE_RISK: edge
  CANDIDATE_RISK: candidate
  STABLE_RISK: stable

jobs:
  local-build:
    # PRs usually come from forks, which are not allowed to access repo secrets.
    # So this job builds the snap locally (using each architecture's own native
    # GitHub-hosted runner), rather than via LP. This tests that a PR has not
    # broken snap building.
    if: github.event_name == 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runs-on: ubuntu-latest
          - arch: arm64
            runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.runs-on }}
    steps:
      - name: Checkout Pebble repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: "go.mod"

      # Generate the version for the local snap build.
      - run: go generate ./cmd

      - name: Build Snap
        id: build-snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79  # v1.3.0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: failure()
        with:
          name: snapcraft-logs-${{ matrix.arch }}
          path: |
            ~/.cache/snapcraft/log/
            ~/.local/state/snapcraft/log/
            pebble_*.txt

      - name: Attach ${{ steps.build-snap.outputs.snap }} to GH workflow execution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: pebble-snap-${{ matrix.arch }}
          path: ${{ steps.build-snap.outputs.snap }}

  # Centralises every "should we build/publish this architecture, and if so
  # how" decision in one place, before spinning up any runners for
  # remote-build/qemu-build/release. Those jobs' matrices are generated entirely
  # from this job's outputs, so an architecture that's skipped via input,
  # already built via the other method, or already attached to the release,
  # never gets a runner of its own at all.
  plan-snap-builds:
    runs-on: ubuntu-latest
    if: |
      github.event_name != 'pull_request' &&
      github.event_name != 'release'
    # contents: write (not just read) is required for `gh release view` to
    # see a draft release -- drafts are only visible to callers with push
    # access to the repo.
    permissions:
      contents: write
    outputs:
      remote-arch: ${{ steps.plan.outputs.remote-arch }}
      qemu-arch: ${{ steps.plan.outputs.qemu-arch }}
      qemu-matrix: ${{ steps.plan.outputs.qemu-matrix }}
      built-arch: ${{ steps.plan.outputs.built-arch }}
    steps:
      - name: Compute which architectures to build, and via which method
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release-tag }}
          SKIP_BUILD: ${{ inputs.skip-build }}
          SKIP_AMD64: ${{ inputs.skip-amd64 }}
          SKIP_ARM64: ${{ inputs.skip-arm64 }}
          SKIP_ARMHF: ${{ inputs.skip-armhf }}
          SKIP_PPC64EL: ${{ inputs.skip-ppc64el }}
          SKIP_RISCV64: ${{ inputs.skip-riscv64 }}
          SKIP_S390X: ${{ inputs.skip-s390x }}
          QEMU_AMD64: ${{ inputs.qemu-amd64 }}
          QEMU_ARM64: ${{ inputs.qemu-arm64 }}
          QEMU_ARMHF: ${{ inputs.qemu-armhf }}
          QEMU_PPC64EL: ${{ inputs.qemu-ppc64el }}
          QEMU_RISCV64: ${{ inputs.qemu-riscv64 }}
          QEMU_S390X: ${{ inputs.qemu-s390x }}
        run: |
          set -eu

          # Per-architecture QEMU boot configuration for qemu-build, kept
          # here (rather than as a static matrix on that job) so it can be
          # filtered down to only the architectures actually selected below.
          QEMU_CONFIG='[
            {"arch":"amd64","qemu-pkg":"qemu-system-x86","qemu-bin":"qemu-system-x86_64","machine":"pc","accel-flags":"-cpu host -enable-kvm"},
            {"arch":"arm64","qemu-pkg":"qemu-system-arm","qemu-bin":"qemu-system-aarch64","machine":"virt","accel-flags":"-cpu max","firmware-pkg":"qemu-efi-aarch64","firmware-path":"/usr/share/AAVMF/AAVMF_CODE.fd"},
            {"arch":"armhf","qemu-pkg":"qemu-system-arm","qemu-bin":"qemu-system-arm","machine":"virt","accel-flags":"-cpu cortex-a15","firmware-pkg":"qemu-efi-arm","firmware-path":"/usr/share/AAVMF/AAVMF32_CODE.fd"},
            {"arch":"ppc64el","qemu-pkg":"qemu-system-ppc","qemu-bin":"qemu-system-ppc64","machine":"pseries","accel-flags":"-cpu POWER9"},
            {"arch":"riscv64","qemu-pkg":"qemu-system-misc","qemu-bin":"qemu-system-riscv64","machine":"virt","accel-flags":"-cpu rv64","firmware-flags":"-bios default"},
            {"arch":"s390x","qemu-pkg":"qemu-system-s390x","qemu-bin":"qemu-system-s390x","machine":"s390-ccw-virtio","accel-flags":"-cpu max"}
          ]'

          REMOTE=()
          QEMU=()

          if [[ "$SKIP_BUILD" != "true" ]]; then
            declare -A SKIP=(
              [amd64]="$SKIP_AMD64"     [arm64]="$SKIP_ARM64"
              [armhf]="$SKIP_ARMHF"     [ppc64el]="$SKIP_PPC64EL"
              [riscv64]="$SKIP_RISCV64" [s390x]="$SKIP_S390X"
            )
            declare -A QEMU_OPT=(
              [amd64]="$QEMU_AMD64"     [arm64]="$QEMU_ARM64"
              [armhf]="$QEMU_ARMHF"     [ppc64el]="$QEMU_PPC64EL"
              [riscv64]="$QEMU_RISCV64" [s390x]="$QEMU_S390X"
            )

            # Idempotency: treat "asset attached to the release" as the
            # single source of truth for "this architecture is done" -- it's
            # uploaded together with (and right after) publishing to the
            # Snap Store, so the two shouldn't normally get out of sync.
            for ARCH in amd64 arm64 armhf ppc64el riscv64 s390x; do
              if [[ -n "$TAG" ]] && gh release view "$TAG" --json assets --jq '.assets[].name' 2>/dev/null | grep -qE "^pebble.*${ARCH}.*\.snap$"; then
                echo "Snap for $ARCH already attached to release $TAG, nothing to build."
                continue
              fi

              # skip-<arch> always wins over qemu-<arch>: it must fully
              # disable building/publishing that architecture (matching
              # record-skipped-architectures' bookkeeping below, which is
              # driven purely by the skip-<arch> inputs), even if someone
              # also opted it into a QEMU build.
              if [[ "${SKIP[$ARCH]}" == "true" ]]; then
                echo "Architecture $ARCH skipped via input."
              elif [[ "${QEMU_OPT[$ARCH]}" == "true" ]]; then
                echo "Architecture $ARCH will be built via QEMU emulation."
                QEMU+=("$ARCH")
              else
                echo "Architecture $ARCH will be built via remote-build."
                REMOTE+=("$ARCH")
              fi
            done
          fi

          REMOTE_JSON=$(jq -nc '$ARGS.positional' --args "${REMOTE[@]}")
          QEMU_JSON=$(jq -nc '$ARGS.positional' --args "${QEMU[@]}")
          QEMU_MATRIX_JSON=$(jq -c --argjson sel "$QEMU_JSON" '[.[] | select(.arch as $a | $sel | index($a) != null)]' <<<"$QEMU_CONFIG")
          BUILT_JSON=$(jq -nc '$ARGS.positional' --args "${REMOTE[@]}" "${QEMU[@]}")

          echo "Selected for remote-build: ${REMOTE[*]:-<none>}"
          echo "Selected for qemu-build:   ${QEMU[*]:-<none>}"

          echo "remote-arch=$REMOTE_JSON" >> "$GITHUB_OUTPUT"
          echo "qemu-arch=$QEMU_JSON" >> "$GITHUB_OUTPUT"
          echo "qemu-matrix=$QEMU_MATRIX_JSON" >> "$GITHUB_OUTPUT"
          echo "built-arch=$BUILT_JSON" >> "$GITHUB_OUTPUT"

  remote-build:
    runs-on: ubuntu-latest
    environment: snap-build
    needs: [plan-snap-builds]
    permissions:
      id-token: write
      attestations: write
      contents: read
    # Only runs at all if plan-snap-builds actually selected at least one
    # architecture for remote-build (it already accounts for skip-build,
    # skip-<arch>, qemu-<arch>, and idempotency -- see its own comments).
    if: |
      needs.plan-snap-builds.result == 'success' &&
      needs.plan-snap-builds.outputs.remote-arch != '[]'
    strategy:
      fail-fast: true
      matrix:
        arch: ${{ fromJSON(needs.plan-snap-builds.outputs.remote-arch) }}
    steps:
      - name: Checkout Pebble repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release-tag }}

      - name: Set LP credentials for remote build
        env:
          LP_CREDENTIALS: ${{ secrets.LP_CREDENTIALS }}
          PEBBLE_DEV_MAILING_LIST: ${{ secrets.PEBBLE_DEV_MAILING_LIST }}
        run: |
          lp_creds_path="$HOME/.local/share/snapcraft/"
          mkdir -p $lp_creds_path
          echo "$LP_CREDENTIALS" > ${lp_creds_path}/launchpad-credentials
          git config --global user.email "$PEBBLE_DEV_MAILING_LIST"
          git config --global user.name "pebble-dev"

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: "go.mod"

      # Ensure Snapcraft will ship the generated version files to LP.
      - run: |
          go generate ./cmd
          git add -f ./cmd/VERSION ./cmd/version_generated.go

      - name: Build Snap for ${{ matrix.arch }}
        id: build-snap
        uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79  # v1.3.0
        with:
          snapcraft-args: remote-build --build-for=${{ matrix.arch }} --launchpad-accept-public-upload

      - name: Attest build provenance
        if: steps.build-snap.outcome == 'success'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: ${{ steps.build-snap.outputs.snap }}

      - name: Rename the logs file, for colons are not allowed in the artifact name
        if: always()
        run: cat snapcraft-pebble-*.txt > snapcraft-logs.txt || echo "no log files"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: snapcraft-logs-${{ matrix.arch }}
          path: |
            ~/.cache/snapcraft/log/
            ~/.local/state/snapcraft/log/
            pebble_*.txt
            snapcraft-logs.txt

      - name: Attach ${{ steps.build-snap.outputs.snap }} to GH workflow execution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: steps.build-snap.outcome == 'success'
        with:
          name: pebble-snap-${{ matrix.arch }}
          path: ${{ steps.build-snap.outputs.snap }}

  qemu-build:
    # Alternative to remote-build: builds a snap for an architecture the
    # runner can't run natively by booting a full-system QEMU VM of that
    # architecture (running the Ubuntu release matching snapcraft.yaml's
    # build-base), and building inside it with `snapcraft pack
    # --destructive-mode`. This produces an unsigned ("dangerous") .snap,
    # same as any locally-built snap. Opt in per architecture via the
    # qemu-<arch> inputs; plan-snap-builds routes any architecture built
    # this way away from remote-build.
    runs-on: ubuntu-latest
    needs: [plan-snap-builds]
    permissions:
      id-token: write
      attestations: write
      contents: read
    # Only runs at all if plan-snap-builds actually selected at least one
    # architecture for a QEMU build.
    if: |
      needs.plan-snap-builds.result == 'success' &&
      needs.plan-snap-builds.outputs.qemu-arch != '[]'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan-snap-builds.outputs.qemu-matrix) }}
    steps:
      - name: Checkout Pebble repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.release-tag }}

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: "go.mod"

      # Generate the version files on the host; they're copied into the VM
      # along with the rest of the source tree below.
      - run: go generate ./cmd

      - name: Install QEMU and supporting tools
        env:
          QEMU_PKG: ${{ matrix.qemu-pkg }}
          FIRMWARE_PKG: ${{ matrix.firmware-pkg }}
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            "$QEMU_PKG" qemu-utils cloud-image-utils genisoimage openssh-client rsync \
            ${FIRMWARE_PKG:+$FIRMWARE_PKG}

      # The target Ubuntu release comes straight from snapcraft.yaml, so the
      # VM matches whatever base the snap actually builds against.
      - name: Determine Ubuntu base image for this build
        id: base
        run: |
          set -eu
          # Prefer build-base (required whenever base: bare is used, as it
          # is here) and only fall back to base if build-base is absent.
          BUILD_BASE=$(grep -E '^build-base:' snap/snapcraft.yaml | head -n1 | awk '{print $2}')
          if [[ -z "$BUILD_BASE" ]]; then
            BUILD_BASE=$(grep -E '^base:' snap/snapcraft.yaml | head -n1 | awk '{print $2}')
          fi
          case "$BUILD_BASE" in
            core18) CODENAME=bionic ;;
            core20) CODENAME=focal ;;
            core22) CODENAME=jammy ;;
            core24) CODENAME=noble ;;
            *) echo "Unrecognised build-base '$BUILD_BASE' in snap/snapcraft.yaml" >&2; exit 1 ;;
          esac
          echo "Using Ubuntu $CODENAME cloud image (snapcraft.yaml build-base: $BUILD_BASE)"
          echo "codename=$CODENAME" >> "$GITHUB_OUTPUT"

      - name: Download Ubuntu cloud image for ${{ matrix.arch }}
        env:
          CODENAME: ${{ steps.base.outputs.codename }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -eu
          # Note: releases/${CODENAME}/release/ names its files with the
          # Ubuntu version number (e.g. ubuntu-22.04-server-cloudimg-*.img),
          # not the codename -- ${CODENAME}/current/ is the tree that uses
          # codename-based filenames for every architecture, including
          # riscv64 (arch name "riscv64" here matches Ubuntu's own naming).
          IMAGE_URL="https://cloud-images.ubuntu.com/${CODENAME}/current/${CODENAME}-server-cloudimg-${ARCH}.img"
          echo "Downloading $IMAGE_URL"
          curl -fSL "$IMAGE_URL" -o vm-base.img
          qemu-img resize vm-base.img +8G
          qemu-img create -f qcow2 -F qcow2 -b vm-base.img vm-disk.qcow2

      - name: Prepare cloud-init seed
        run: |
          set -eu
          ssh-keygen -t ed25519 -N "" -f vm-key
          cat > user-data <<CLOUDEOF
          #cloud-config
          hostname: qemu-build
          ssh_pwauth: false
          package_update: false
          users:
            - name: builder
              sudo: ALL=(ALL) NOPASSWD:ALL
              shell: /bin/bash
              ssh_authorized_keys:
                - $(cat vm-key.pub)
          CLOUDEOF
          cat > meta-data <<METAEOF
          instance-id: qemu-build
          local-hostname: qemu-build
          METAEOF
          cloud-localds seed.img user-data meta-data

      - name: Boot QEMU VM for ${{ matrix.arch }}
        env:
          QEMU_BIN: ${{ matrix.qemu-bin }}
          MACHINE: ${{ matrix.machine }}
          ACCEL_FLAGS: ${{ matrix.accel-flags }}
          FIRMWARE_FLAGS: ${{ matrix.firmware-flags }}
          FIRMWARE_PATH: ${{ matrix.firmware-path }}
        run: |
          set -eu
          FW_ARGS=()
          if [[ -n "${FIRMWARE_PATH:-}" ]]; then
            FW_ARGS=(-drive "if=pflash,format=raw,readonly=on,file=${FIRMWARE_PATH}")
          elif [[ -n "${FIRMWARE_FLAGS:-}" ]]; then
            FW_ARGS=(${FIRMWARE_FLAGS})
          fi

          "$QEMU_BIN" \
            -machine "$MACHINE" ${ACCEL_FLAGS} \
            -m 4096 -smp 2 \
            "${FW_ARGS[@]}" \
            -drive if=virtio,format=qcow2,file=vm-disk.qcow2 \
            -drive if=virtio,format=raw,file=seed.img \
            -netdev user,id=net0,hostfwd=tcp::2222-:22 \
            -device virtio-net-pci,netdev=net0 \
            -nographic -serial file:serial.log \
            &
          echo $! > qemu.pid
          disown

          echo "Waiting for SSH to come up..."
          for i in $(seq 1 60); do
            if ssh -i vm-key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=5 builder@127.0.0.1 true 2>/dev/null; then
              echo "VM is up."
              exit 0
            fi
            sleep 10
          done
          echo "Timed out waiting for the VM to boot" >&2
          cat serial.log || true
          exit 1

      - name: Copy Pebble source into the VM
        run: |
          set -eu
          SSH_OPTS=(-i vm-key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          ssh "${SSH_OPTS[@]}" builder@127.0.0.1 mkdir -p ~/pebble
          rsync -az --exclude .git -e "ssh ${SSH_OPTS[*]}" ./ builder@127.0.0.1:~/pebble/

      - name: Build snap inside the VM
        id: build-snap
        run: |
          set -eu
          SSH_OPTS=(-i vm-key -p 2222 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null)
          ssh "${SSH_OPTS[@]}" builder@127.0.0.1 "sudo snap install snapcraft --classic"
          ssh "${SSH_OPTS[@]}" builder@127.0.0.1 "cd ~/pebble && sudo snapcraft pack --destructive-mode"
          SNAP_NAME=$(ssh "${SSH_OPTS[@]}" builder@127.0.0.1 "cd ~/pebble && ls -1 *.snap" | tail -n1)
          scp "${SSH_OPTS[@]}" "builder@127.0.0.1:~/pebble/${SNAP_NAME}" "./${SNAP_NAME}"
          echo "snap=${SNAP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Shut down the VM
        if: always()
        run: |
          if [[ -f qemu.pid ]]; then
            kill "$(cat qemu.pid)" 2>/dev/null || true
          fi

      - name: Attest build provenance
        if: steps.build-snap.outcome == 'success'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373  # v4.1.1
        with:
          subject-path: ${{ steps.build-snap.outputs.snap }}

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: always()
        with:
          name: qemu-build-logs-${{ matrix.arch }}
          path: serial.log

      - name: Attach ${{ steps.build-snap.outputs.snap }} to GH workflow execution
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        if: steps.build-snap.outcome == 'success'
        with:
          name: pebble-snap-${{ matrix.arch }}
          path: ${{ steps.build-snap.outputs.snap }}

  test:
    runs-on: ubuntu-latest
    needs: [local-build, remote-build, qemu-build]
    env:
      # Testing is only enabled on amd64. We can add arm64 once we have such runners.
      TEST_ON: amd64
    if: |
      always() &&
      (needs.local-build.result == 'success' || needs.local-build.result == 'skipped') &&
      (needs.remote-build.result == 'success' || needs.remote-build.result == 'skipped') &&
      (needs.qemu-build.result == 'success' || needs.qemu-build.result == 'skipped')
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: pebble-snap-amd64
          if-no-artifact-found: ignore

      # Idempotency: if the amd64 snap wasn't (re)built above (either
      # skipped via input, or already uploaded to the release in a
      # previous run), there's nothing to test.
      - id: get-snap
        run: |
          shopt -s nullglob
          files=(pebble*${TEST_ON}*.snap)
          if [[ ${#files[@]} -gt 0 ]]; then
            echo "filename=${files[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "filename=" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and test snap
        if: steps.get-snap.outputs.filename != ''
        env:
          SNAP_FILENAME: ${{ steps.get-snap.outputs.filename }}
        run: |
          set -ex
          sudo snap install --dangerous --classic "$SNAP_FILENAME"

          # Make sure it is installed
          pebble version --client

          # Run smoke test
          pebble enter --create-dirs exec echo Hello | grep Hello

  release:
    runs-on: ubuntu-latest
    environment: snap-build
    needs: [test, plan-snap-builds]
    permissions:
      contents: write
    # The channel to publish to depends on why we're building: a push to master
    # goes to the continuous edge channel, while a release build goes straight
    # to candidate, ready for the promote job below to move it to stable once
    # the corresponding GitHub release is published.
    env:
      GH_REPO: ${{ github.repository }}
      RELEASE_RISK: ${{ github.event_name == 'push' && 'edge' || 'candidate' }}
      # FIPS releases are tagged with a "-fips" suffix (see cmd/version.go),
      # and published to the separate "fips" track rather than "latest".
      DEFAULT_TRACK: ${{ endsWith(inputs.release-tag, '-fips') && 'fips' || 'latest' }}
    # Only runs for architectures plan-snap-builds actually selected for a
    # build this run (via either remote-build or qemu-build) -- it already
    # excludes anything skipped via input or already attached to the
    # release, so there's nothing for this job to (no-op) iterate over.
    if: |
      always() &&
      needs.test.result == 'success' &&
      needs.plan-snap-builds.result == 'success' &&
      needs.plan-snap-builds.outputs.built-arch != '[]'
    strategy:
      fail-fast: false
      matrix:
        arch: ${{ fromJSON(needs.plan-snap-builds.outputs.built-arch) }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          pattern: pebble-snap-${{ matrix.arch }}
          if-no-artifact-found: ignore

      # There's nothing to publish/upload if this architecture's snap
      # wasn't actually produced above -- e.g. its build failed.
      - id: get-snap
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          shopt -s nullglob
          files=(pebble*${ARCH}*.snap)
          if [[ ${#files[@]} -gt 0 ]]; then
            echo "filename=${files[0]}" >> "$GITHUB_OUTPUT"
          else
            echo "filename=" >> "$GITHUB_OUTPUT"
          fi

      - name: Release snap to ${{ env.DEFAULT_TRACK }}/${{ env.RELEASE_RISK }}
        if: steps.get-snap.outputs.filename != '' && !inputs.dry-run-snap-publish
        uses: snapcore/action-publish@214b86e5ca036ead1668c79afb81e550e6c54d40  # v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        with:
          snap: ${{ steps.get-snap.outputs.filename }}
          release: ${{ env.DEFAULT_TRACK }}/${{ env.RELEASE_RISK }}

      - name: Skip publishing to ${{ env.DEFAULT_TRACK }}/${{ env.RELEASE_RISK }} (dry run)
        if: steps.get-snap.outputs.filename != '' && inputs.dry-run-snap-publish
        env:
          SNAP_FILE: ${{ steps.get-snap.outputs.filename }}
        run: |
          echo "Dry run: would have published ${SNAP_FILE} to ${DEFAULT_TRACK}/${RELEASE_RISK}."

      - name: Upload snap to release
        if: steps.get-snap.outputs.filename != '' && inputs.release-tag != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.release-tag }}
          SNAP_FILE: ${{ steps.get-snap.outputs.filename }}
        run: gh release upload "$TAG" "$SNAP_FILE" --clobber

  # Records, as hidden HTML comments in the release body, which architectures
  # were skipped via input this run, and whether this run was a dry run --
  # so that the promote job below (which runs much later, triggered by the
  # release being published, and has no other way to know what happened
  # here) knows which architectures to leave alone rather than promoting a
  # stale or nonexistent candidate, and skips promotion entirely for a
  # dry-run draft (since nothing was actually published to the store).
  record-skipped-architectures:
    runs-on: ubuntu-latest
    needs: [release, plan-snap-builds]
    # `release`'s own `if:` requires `needs.test.result == 'success'`
    # (strictly, not `skipped`) -- so a genuine build/test failure upstream
    # cascades as `release.result == 'skipped'`, indistinguishable at this
    # level from a legitimate "nothing to build" skip. We disambiguate by
    # checking plan-snap-builds directly: if it succeeded and selected zero
    # architectures to build this run (via skip-build, every individual
    # skip-<arch>, or idempotency), that's the only legitimate reason for
    # `release` to not succeed while still wanting to record skipped
    # architectures. Anything else non-successful means a real failure
    # occurred somewhere upstream, and must not be recorded as an
    # intentional per-architecture skip.
    if: |
      always() &&
      inputs.release-tag != '' &&
      needs.plan-snap-builds.result == 'success' &&
      (needs.release.result == 'success' || needs.plan-snap-builds.outputs.built-arch == '[]')
    permissions:
      contents: write
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.release-tag }}
      SKIP_AMD64: ${{ inputs.skip-amd64 }}
      SKIP_ARM64: ${{ inputs.skip-arm64 }}
      SKIP_ARMHF: ${{ inputs.skip-armhf }}
      SKIP_PPC64EL: ${{ inputs.skip-ppc64el }}
      SKIP_RISCV64: ${{ inputs.skip-riscv64 }}
      SKIP_S390X: ${{ inputs.skip-s390x }}
      DRY_RUN: ${{ inputs.dry-run-snap-publish }}
    steps:
      - name: Update release notes with skipped architectures
        run: |
          set -eu
          declare -A ARCH_SKIP=(
            [amd64]="$SKIP_AMD64"
            [arm64]="$SKIP_ARM64"
            [armhf]="$SKIP_ARMHF"
            [ppc64el]="$SKIP_PPC64EL"
            [riscv64]="$SKIP_RISCV64"
            [s390x]="$SKIP_S390X"
          )

          SKIPPED=()
          for ARCH in "${!ARCH_SKIP[@]}"; do
            if [[ "${ARCH_SKIP[$ARCH]}" == "true" ]]; then
              SKIPPED+=("$ARCH")
            fi
          done
          echo "Architectures skipped: ${SKIPPED[*]:-none}"

          CURRENT_BODY=$(gh release view "$TAG" --json body --jq .body)
          # Drop any markers from a previous run of this job, so re-runs
          # don't accumulate stale/duplicate entries.
          STRIPPED_BODY=$(printf '%s\n' "$CURRENT_BODY" \
            | grep -vE '^<!-- pebble-snap-skip-arch: [a-z0-9]+ -->$' \
            | grep -vE '^<!-- pebble-snap-dry-run: (true|false) -->$' || true)

          NEW_BODY="$STRIPPED_BODY"
          for ARCH in "${SKIPPED[@]}"; do
            NEW_BODY="${NEW_BODY}"$'\n'"<!-- pebble-snap-skip-arch: ${ARCH} -->"
          done
          if [[ "$DRY_RUN" == "true" ]]; then
            NEW_BODY="${NEW_BODY}"$'\n'"<!-- pebble-snap-dry-run: true -->"
          fi

          if [[ "$NEW_BODY" != "$CURRENT_BODY" ]]; then
            gh release edit "$TAG" --notes "$NEW_BODY"
          fi

  # Promotes the already-published latest/candidate build to latest/stable,
  # once a maintainer publishes the corresponding GitHub release. This never
  # builds or publishes anything new -- it assumes the `release` job above
  # already published the exact candidate build being promoted (as part of
  # release.yml's run for that release), and skips any architecture the
  # record-skipped-architectures job marked as having no candidate snap, or
  # all architectures if that job marked the release as a dry run.
  promote:
    runs-on: ubuntu-latest
    environment: snap-build
    permissions:
      contents: read
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name }}
      # FIPS releases are tagged with a "-fips" suffix (see cmd/version.go),
      # and promoted on the separate "fips" track rather than "latest".
      DEFAULT_TRACK: ${{ endsWith(github.event.release.tag_name, '-fips') && 'fips' || 'latest' }}
    if: github.event_name == 'release'
    strategy:
      fail-fast: false
      matrix:
        arch: ["amd64", "arm64", "armhf", "ppc64el", "riscv64", "s390x"]
    steps:
      - name: Check if this architecture was skipped when the release was drafted
        id: check
        run: |
          set -eu
          BODY=$(gh release view "$TAG" --json body --jq .body)
          if echo "$BODY" | grep -qxF "<!-- pebble-snap-dry-run: true -->"; then
            echo "Release was drafted as a dry run; no candidate snap was published, skipping promotion."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif echo "$BODY" | grep -qxF "<!-- pebble-snap-skip-arch: ${{ matrix.arch }} -->"; then
            echo "Architecture ${{ matrix.arch }} has no candidate snap, skipping promotion."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Snapcraft
        if: steps.check.outputs.skip != 'true'
        run: sudo snap install snapcraft --classic

      # Idempotency: skip promoting if stable is already at the same
      # revision as candidate (i.e. this was already promoted).
      - name: Get current ${{ matrix.arch }} snap in ${{ env.DEFAULT_TRACK }}/${{ env.CANDIDATE_RISK }}
        id: get-snap
        if: steps.check.outputs.skip != 'true'
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        run: |
          set -eu
          STATUS=$(snapcraft status pebble --track "$DEFAULT_TRACK" --arch ${{ matrix.arch }})
          CANDIDATE_REV=$(echo "$STATUS" | awk 'NR==1 { pos = index($0, "Revision") } /candidate/ { print 0+substr($0, pos) }')
          STABLE_REV=$(echo "$STATUS" | awk 'NR==1 { pos = index($0, "Revision") } /stable/ { print 0+substr($0, pos) }')
          echo "Candidate revision: $CANDIDATE_REV, stable revision: $STABLE_REV"
          echo "revision=${CANDIDATE_REV}" >> "$GITHUB_OUTPUT"
          if [[ "$CANDIDATE_REV" == "$STABLE_REV" ]]; then
            echo "already-promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-promoted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Promote snap to ${{ env.DEFAULT_TRACK }}/${{ env.STABLE_RISK }}
        if: steps.check.outputs.skip != 'true' && steps.get-snap.outputs.already-promoted == 'false' && !inputs.dry-run-snap-publish
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
          REVISION: ${{ steps.get-snap.outputs.revision }}
        run: |
          snapcraft release pebble \
            "${REVISION}" \
            "${DEFAULT_TRACK}/${STABLE_RISK}"

      - name: Skip promoting to ${{ env.DEFAULT_TRACK }}/${{ env.STABLE_RISK }} (dry run)
        if: steps.check.outputs.skip != 'true' && steps.get-snap.outputs.already-promoted == 'false' && inputs.dry-run-snap-publish
        env:
          REVISION: ${{ steps.get-snap.outputs.revision }}
        run: |
          echo "Dry run: would have promoted revision ${REVISION} to ${DEFAULT_TRACK}/${STABLE_RISK}."
