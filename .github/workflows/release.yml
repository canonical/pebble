name: Release

# Prepares and drives an entire Pebble release (either a normal master release,
# or a FIPS release):
#
#   1. Bump `Version` in cmd/version.go on `master` (or, for FIPS, merge an
#      already-published release tag into `fips` and append the `-fips` suffix),
#      open a PR for it, and wait for it to be approved and merged.
#   2. Tag the tip of the target branch, draft a GitHub release with title/notes
#      generated by an agent.
#   3. Build binaries, snaps, run sbomber and upload the artefacts to the draft
#      release. Snaps are published straight to the latest/candidate channel.
#      Once you publish the GitHub release, snap.yml automatically promotes that
#      candidate build to latest/stable (see the comments in snap.yml).
#
# Reviewing and publishing the draft release is always a manual step; see
# HACKING.md.
#
# ## Skipping steps / idempotent re-runs
#
# The `skip-*` inputs let you skip parts of the process (e.g. if you already did
# them manually, or want to defer them). Skipping a *creation* step (e.g. the
# version bump PR, or the draft release) doesn't just do nothing -- it makes the
# workflow verify the thing you skipped actually exists (and, for the draft
# release, brings it up to date with the tip of the target branch) and, for the
# version bump PR, wait for it to merge if it hasn't yet.
#
# The whole workflow is also designed to be safely re-run without any skips
# selected: every step checks whether its work is already done (version already
# bumped, release already exists, a given architecture's binary/snap already
# uploaded, a snap channel already at the expected revision etc.) and skips
# itself automatically if so. This means that, for example, if only one arch
# failed to build, simply re-running the workflow with the same inputs will only
# rebuild that architecture.

on:
  workflow_dispatch:
    inputs:
      version:
        description: >-
          Version to release, e.g. v1.33.0. For a FIPS release, this must be
          the tag of an already-published non-FIPS release to merge into
          fips.
        required: true
      fips:
        description: "FIPS release (merge the tag into the fips branch instead of bumping master)"
        required: false
        type: boolean
        default: false
      skip-version-bump-pr:
        description: >-
          Skip creating the version bump / fips-merge PR. Requires that the
          target branch is already at the expected version, or that a PR
          for it already exists (in which case this waits for it to merge).
        required: false
        type: boolean
        default: false
      skip-draft-release:
        description: >-
          Skip creating the draft release. Requires that it already exists;
          it will be updated to point at the tip of the target branch.
        required: false
        type: boolean
        default: false
      skip-build-binaries:
        description: "Skip building/uploading binaries entirely"
        required: false
        type: boolean
        default: false
      skip-build-snaps:
        description: "Skip building/uploading/publishing snaps entirely"
        required: false
        type: boolean
        default: false
      skip-arch-amd64:
        description: "Skip the amd64 architecture (binaries and snap)"
        required: false
        type: boolean
        default: false
      skip-arch-arm64:
        description: "Skip the arm64 architecture (binaries and snap)"
        required: false
        type: boolean
        default: false
      skip-arch-armv6:
        description: "Skip the armv6/armhf architecture (binaries and snap)"
        required: false
        type: boolean
        default: false
      skip-arch-ppc64le:
        description: "Skip the ppc64le/ppc64el architecture (binaries and snap)"
        required: false
        type: boolean
        default: false
      skip-arch-riscv64:
        description: "Skip the riscv64 architecture (binaries and snap)"
        required: false
        type: boolean
        default: false
      skip-arch-s390x:
        description: "Skip the s390x architecture (binaries and snap)"
        required: false
        type: boolean
        default: false
      skip-sbomber:
        description: "Skip running sbomber and uploading its report to the release"
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: release-${{ inputs.version }}-${{ inputs.fips }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      target-branch: ${{ steps.vars.outputs.base-branch }}
    steps:
      - name: Validate version format
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version '$VERSION' must look like vX.Y.Z"
            exit 1
          fi

      - name: Compute variables
        id: vars
        env:
          FIPS: ${{ inputs.fips }}
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [[ "$FIPS" == "true" ]]; then
            echo "base-branch=fips" >> "$GITHUB_OUTPUT"
            echo "label=automated-fips-release" >> "$GITHUB_OUTPUT"
            echo "branch=fips-merge/${VERSION}" >> "$GITHUB_OUTPUT"
            echo "pr-title=chore: merge ${VERSION} into fips branch" >> "$GITHUB_OUTPUT"
            echo "merge-method=--merge" >> "$GITHUB_OUTPUT"
            echo "expected-version=${VERSION}-fips" >> "$GITHUB_OUTPUT"
          else
            echo "base-branch=master" >> "$GITHUB_OUTPUT"
            echo "label=automated-release" >> "$GITHUB_OUTPUT"
            echo "branch=release/${VERSION}" >> "$GITHUB_OUTPUT"
            echo "pr-title=chore: bump version to ${VERSION}" >> "$GITHUB_OUTPUT"
            echo "merge-method=--squash" >> "$GITHUB_OUTPUT"
            echo "expected-version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout ${{ steps.vars.outputs.base-branch }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: ${{ steps.vars.outputs.base-branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6
        with:
          go-version-file: "go.mod"
          cache: false

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Idempotency: if the target branch is already at the expected
      # version, the version bump / fips-merge PR has already merged (in a
      # previous run, or otherwise) -- there's nothing left to do here.
      - name: Check current version
        id: current
        env:
          EXPECTED_VERSION: ${{ steps.vars.outputs.expected-version }}
        run: |
          set -eu
          CURRENT=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' cmd/version.go)
          if [[ "$CURRENT" == "$EXPECTED_VERSION" ]]; then
            echo "${{ steps.vars.outputs.base-branch }} is already at ${EXPECTED_VERSION}."
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check for an existing pull request
        id: existing
        if: steps.current.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ steps.vars.outputs.branch }}
          BASE_BRANCH: ${{ steps.vars.outputs.base-branch }}
        run: |
          set -eu
          URL=$(gh pr list --head "$BRANCH" --base "$BASE_BRANCH" --state open --json url --jq '.[0].url // empty')
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          if [[ -n "$URL" ]]; then
            echo "Found existing pull request: $URL"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if skip-version-bump-pr was set but there's nothing to skip to
        if: steps.current.outputs.done != 'true' && inputs.skip-version-bump-pr && steps.existing.outputs.found != 'true'
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
          BASE_BRANCH: ${{ steps.vars.outputs.base-branch }}
          EXPECTED_VERSION: ${{ steps.vars.outputs.expected-version }}
        run: |
          echo "::error::skip-version-bump-pr was set, but no open PR was found for branch '${BRANCH}', and ${BASE_BRANCH} is not already at ${EXPECTED_VERSION}. Run this workflow without skip-version-bump-pr first."
          exit 1

      - name: Create branch
        if: steps.current.outputs.done != 'true' && steps.existing.outputs.found != 'true'
        env:
          BRANCH: ${{ steps.vars.outputs.branch }}
        run: |
          set -eu
          # If the branch already exists (e.g. a previous run got partway
          # through and crashed before opening the PR), reuse it instead of
          # starting over.
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "Branch $BRANCH already exists, reusing it."
            git fetch origin "$BRANCH"
            git checkout -B "$BRANCH" "origin/$BRANCH"
          else
            git checkout -b "$BRANCH"
          fi

      - name: Merge tag into fips branch
        id: merge
        if: inputs.fips && steps.current.outputs.done != 'true' && steps.existing.outputs.found != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if git merge-base --is-ancestor "$VERSION" HEAD 2>/dev/null; then
            echo "Tag $VERSION is already merged."
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            git fetch origin "+refs/tags/${VERSION}:refs/tags/${VERSION}"
            if git merge --no-ff --no-commit "$VERSION"; then
              echo "conflicts=false" >> "$GITHUB_OUTPUT"
            else
              echo "conflicts=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Install opencode
        if: inputs.fips && steps.current.outputs.done != 'true' && steps.existing.outputs.found != 'true' && steps.merge.outputs.conflicts == 'true'
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.25

      - name: Resolve conflicts with opencode
        if: inputs.fips && steps.current.outputs.done != 'true' && steps.existing.outputs.found != 'true' && steps.merge.outputs.conflicts == 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROMPT: |
            This repository checkout is in the middle of a git merge with
            conflicts: merging tag ${{ inputs.version }} into the fips
            branch.

            Run `git status` to find every conflicted file, and resolve all
            of them, using this guidance:

            - The fips branch intentionally excludes standard TLS/crypto
              functionality in favour of FIPS-approved alternatives. Whenever
              a conflict touches TLS or crypto code, resolve it by dropping
              the incoming TLS/crypto usage/functionality rather than
              reintroducing it, adapting surrounding code as needed so it
              still builds and makes sense without it.
            - The fips branch also intentionally carries its own
              infrastructure differences from master (for example CI
              workflow files under .github/workflows that target the fips
              branch instead of master, and other fips-specific build/CI
              configuration). For conflicts in this kind of infrastructure
              file, prefer the fips branch's side unless the incoming change
              is clearly an unrelated improvement that should carry over
              (e.g. fixing an unrelated bug in a shared step) -- use your
              judgement, and keep any fips-specific customization intact.
            - For all other conflicts (regular application code, docs,
              tests, etc. with no TLS/crypto/infrastructure angle), take the
              incoming change from ${{ inputs.version }}.

            After resolving every conflict: make sure no conflict markers
            (<<<<<<<, =======, >>>>>>>) remain anywhere, make sure
            `go build ./...` succeeds, and `git add` every resolved file.

            Do not commit, push, or open a pull request yourself -- leave the
            resolved changes staged.
        run: |
          opencode run --auto --model openrouter/google/gemini-flash-latest "$PROMPT"

      - name: Verify conflicts are resolved
        if: inputs.fips && steps.current.outputs.done != 'true' && steps.existing.outputs.found != 'true' && steps.merge.outputs.conflicts == 'true'
        run: |
          set -eu
          if grep -RIl --exclude-dir=.git -e '^<<<<<<< ' -e '^=======$' -e '^>>>>>>> ' .; then
            echo "::error::Conflict markers remain after opencode resolution"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "::error::No staged changes after conflict resolution"
            exit 1
          fi
          go build ./...

      - name: Update cmd/version.go (non-FIPS)
        if: "!inputs.fips && steps.current.outputs.done != 'true' && steps.existing.outputs.found != 'true'"
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          sed -i "s/^var Version = \".*\"\$/var Version = \"${VERSION}\"/" cmd/version.go
          grep -qF "var Version = \"${VERSION}\"" cmd/version.go

      - name: Update cmd/version.go (FIPS)
        if: inputs.fips && steps.current.outputs.done != 'true' && steps.existing.outputs.found != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -eu
          sed -i "s/^var Version = \".*\"\$/var Version = \"${VERSION}-fips\"/" cmd/version.go
          grep -qF "var Version = \"${VERSION}-fips\"" cmd/version.go
          git add cmd/version.go

      - name: Commit
        if: steps.current.outputs.done != 'true' && steps.existing.outputs.found != 'true'
        env:
          PR_TITLE: ${{ steps.vars.outputs.pr-title }}
        run: |
          set -eu
          if git diff --quiet && git diff --cached --quiet; then
            echo "Nothing to commit; branch is already up to date."
          else
            git commit --all --message "$PR_TITLE"
          fi

      - name: Create label
        if: steps.current.outputs.done != 'true' && steps.existing.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: ${{ steps.vars.outputs.label }}
        run: |
          gh label create "$LABEL" \
            --color 0E8A16 \
            --description "Automated pull request for a Pebble release" \
            --force

      - name: Push branch and open pull request
        id: create
        if: steps.current.outputs.done != 'true' && steps.existing.outputs.found != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          FIPS: ${{ inputs.fips }}
          BASE_BRANCH: ${{ steps.vars.outputs.base-branch }}
          BRANCH: ${{ steps.vars.outputs.branch }}
          PR_TITLE: ${{ steps.vars.outputs.pr-title }}
          LABEL: ${{ steps.vars.outputs.label }}
          MERGE_METHOD: ${{ steps.vars.outputs.merge-method }}
        run: |
          set -eu
          git push origin "$BRANCH"

          if [[ "$FIPS" == "true" ]]; then
            BODY="Automated merge of ${VERSION} into fips, in preparation for the ${VERSION}-fips release.

          Conflicts (if any) were resolved by dropping TLS and crypto usages from the merged code; please review carefully."
          else
            BODY="Automated version bump for the ${VERSION} release.

          Once this is approved and merged, a draft GitHub release will be created automatically."
          fi

          PR_URL=$(gh pr create \
            --base "$BASE_BRANCH" \
            --head "$BRANCH" \
            --title "$PR_TITLE" \
            --body "$BODY" \
            --label "$LABEL")
          echo "Opened $PR_URL"
          echo "url=${PR_URL}" >> "$GITHUB_OUTPUT"

          # Requires branch protection + "Allow auto-merge". A true merge
          # commit (not squash) is used for the fips branch, to preserve its
          # history.
          gh pr merge $MERGE_METHOD --auto "$PR_URL"

      - name: Re-affirm auto-merge on existing pull request
        if: steps.existing.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.existing.outputs.url }}
          MERGE_METHOD: ${{ steps.vars.outputs.merge-method }}
        run: gh pr merge $MERGE_METHOD --auto "$PR_URL"

      - name: Determine pull request URL
        id: pr
        if: steps.current.outputs.done != 'true'
        run: echo "url=${{ steps.existing.outputs.url }}${{ steps.create.outputs.url }}" >> "$GITHUB_OUTPUT"

      - name: Wait for the pull request to merge
        if: steps.current.outputs.done != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          set -eu
          POLL_INTERVAL_SECONDS=60
          # Stay comfortably under the 6-hour GitHub-hosted job time limit.
          TIMEOUT_SECONDS=$((5 * 3600 + 30 * 60))
          ELAPSED=0

          while true; do
            STATE=$(gh pr view "$PR_URL" --json state --jq .state)

            if [[ "$STATE" == "MERGED" ]]; then
              echo "$PR_URL has merged."
              break
            fi

            if [[ "$STATE" == "CLOSED" ]]; then
              echo "::error::$PR_URL was closed without merging."
              exit 1
            fi

            if (( ELAPSED >= TIMEOUT_SECONDS )); then
              echo "::error::Timed out after ${ELAPSED}s waiting for $PR_URL to merge."
              exit 1
            fi

            echo "Waiting for $PR_URL to be approved and merged (state: ${STATE}, elapsed: ${ELAPSED}s)..."
            sleep "$POLL_INTERVAL_SECONDS"
            ELAPSED=$((ELAPSED + POLL_INTERVAL_SECONDS))
          done

  draft-release:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout ${{ needs.prepare.outputs.target-branch }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7
        with:
          ref: ${{ needs.prepare.outputs.target-branch }}
          fetch-depth: 0
          persist-credentials: true

      - name: Determine version
        id: version
        run: |
          set -eu
          VERSION=$(sed -n 's/^var Version = "\(.*\)"$/\1/p' cmd/version.go)
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not determine version from cmd/version.go"
            exit 1
          fi
          echo "Version is ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # Idempotency: if the release already exists, there's nothing left to
      # create -- just make sure its tag follows the branch (below).
      - name: Check for an existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          if gh release view "$VERSION" --json tagName >/dev/null 2>&1; then
            echo "Release $VERSION already exists."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if skip-draft-release was set but the release doesn't exist
        if: steps.existing.outputs.exists != 'true' && inputs.skip-draft-release
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "::error::skip-draft-release was set, but no release exists for ${VERSION}. Run this workflow without skip-draft-release first."
          exit 1

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Ensure the tag points at the tip of ${{ needs.prepare.outputs.target-branch }}
        id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          git fetch origin --tags --force
          HEAD_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-parse "refs/tags/${VERSION}" 2>/dev/null || echo "")
          if [[ "$TAG_SHA" != "$HEAD_SHA" ]]; then
            echo "Moving tag ${VERSION} to ${HEAD_SHA} (was: ${TAG_SHA:-none})"
            git tag -f "$VERSION" HEAD
            git push --force origin "refs/tags/${VERSION}"
            echo "moved=true" >> "$GITHUB_OUTPUT"
          else
            echo "Tag ${VERSION} already points at HEAD."
            echo "moved=false" >> "$GITHUB_OUTPUT"
          fi

      # If the tag moved, any artifacts already uploaded to the draft release
      # were built from the old commit and are now stale, so remove them. The
      # binaries/snap/sbomber jobs will re-upload fresh artifacts for the new
      # commit.
      - name: Delete stale artifacts from the draft release
        if: steps.existing.outputs.exists == 'true' && steps.tag.outputs.moved == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -eu
          mapfile -t ASSETS < <(gh release view "$VERSION" --json assets --jq '.assets[].name')
          if [[ "${#ASSETS[@]}" -eq 0 ]]; then
            echo "No artifacts to delete from release ${VERSION}."
          else
            for ASSET in "${ASSETS[@]}"; do
              echo "Deleting stale artifact ${ASSET} from release ${VERSION}"
              gh release delete-asset "$VERSION" "$ASSET" --yes
            done
          fi

      - name: Gather previous release notes for context
        id: previous
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FIPS: ${{ inputs.fips }}
        run: |
          set -eu
          mkdir -p .release
          if [[ "$FIPS" == "true" ]]; then
            MATCH_PATTERN='-fips$'
          else
            MATCH_PATTERN='^v[0-9]+\.[0-9]+\.[0-9]+$'
          fi

          gh release list --exclude-drafts --limit 50 --json tagName \
            --jq '.[].tagName' | grep -E "$MATCH_PATTERN" | head -n 5 > .release/previous-tags.txt || true

          : > .release/previous-notes.md
          while read -r tag; do
            [[ -z "$tag" ]] && continue
            echo "## ${tag}" >> .release/previous-notes.md
            gh release view "$tag" --json body --jq .body >> .release/previous-notes.md
            printf '\n---\n\n' >> .release/previous-notes.md
          done < .release/previous-tags.txt

          PREV_TAG=$(head -n 1 .release/previous-tags.txt || true)
          echo "previous-tag=${PREV_TAG}" >> "$GITHUB_OUTPUT"

      - name: Gather commit log since previous release
        if: steps.existing.outputs.exists != 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PREV_TAG: ${{ steps.previous.outputs.previous-tag }}
        run: |
          set -eu
          if [[ -n "$PREV_TAG" ]]; then
            git --no-pager log --no-merges --pretty=format:'- %s (%h)' "${PREV_TAG}..${VERSION}" > .release/commits.txt
          else
            git --no-pager log --no-merges --pretty=format:'- %s (%h)' "${VERSION}" > .release/commits.txt
          fi

      - name: Install opencode
        if: steps.existing.outputs.exists != 'true'
        run: curl -fsSL https://opencode.ai/install | bash -s -- --version 1.18.25

      - name: Generate release title and notes with opencode
        if: steps.existing.outputs.exists != 'true'
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          PROMPT: |
            Write GitHub release notes for Pebble version ${{ steps.version.outputs.version }}.

            Read `.release/previous-notes.md`: it contains the notes from the
            previous few ${{ inputs.fips && 'FIPS' || 'non-FIPS' }} Pebble
            releases. Use them purely as style/format/tone/detail-level
            examples -- don't reuse their content.

            Read `.release/commits.txt`: it's the list of commits included in
            this release. Use it to understand what actually changed, and
            group/describe the changes sensibly (e.g. features, fixes).

            Write your output to exactly these two files, and don't modify,
            commit, or push anything else:
              - `.release/title.txt`: a single-line release title that
                includes the version number and a short summary of the
                release.
              - `.release/notes.md`: the full release notes body in Markdown.
                If `.release/previous-tags.txt` has a previous tag on its
                first line, end the notes with a link to the full diff:
                https://github.com/${{ github.repository }}/compare/<previous-tag>...${{ steps.version.outputs.version }}
        run: |
          opencode run --auto --model openrouter/google/gemini-flash-latest "$PROMPT"

      - name: Create draft release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET_BRANCH: ${{ needs.prepare.outputs.target-branch }}
        run: |
          set -eu
          gh release create "$VERSION" \
            --draft \
            --target "$TARGET_BRANCH" \
            --title "$(cat .release/title.txt)" \
            --notes-file .release/notes.md

  binaries:
    needs: [prepare, draft-release]
    if: ${{ !inputs.skip-build-binaries }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/binaries.yml
    secrets: inherit
    with:
      release-tag: ${{ needs.draft-release.outputs.version }}
      skip-amd64: ${{ inputs.skip-arch-amd64 }}
      skip-arm64: ${{ inputs.skip-arch-arm64 }}
      skip-armv6: ${{ inputs.skip-arch-armv6 }}
      skip-ppc64le: ${{ inputs.skip-arch-ppc64le }}
      skip-riscv64: ${{ inputs.skip-arch-riscv64 }}
      skip-s390x: ${{ inputs.skip-arch-s390x }}

  snap:
    needs: [prepare, draft-release]
    if: ${{ !inputs.skip-build-snaps }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/snap.yml
    secrets: inherit
    with:
      release-tag: ${{ needs.draft-release.outputs.version }}
      skip-amd64: ${{ inputs.skip-arch-amd64 }}
      skip-arm64: ${{ inputs.skip-arch-arm64 }}
      skip-armhf: ${{ inputs.skip-arch-armv6 }}
      skip-ppc64el: ${{ inputs.skip-arch-ppc64le }}
      skip-riscv64: ${{ inputs.skip-arch-riscv64 }}
      skip-s390x: ${{ inputs.skip-arch-s390x }}

  sbomber:
    needs: [draft-release, snap]
    if: |
      !inputs.skip-sbomber &&
      always() &&
      needs.draft-release.result == 'success' &&
      (needs.snap.result == 'success' || needs.snap.result == 'skipped')
    permissions:
      contents: write
    uses: ./.github/workflows/sbom-secscan.yaml
    secrets: inherit
    with:
      release-tag: ${{ needs.draft-release.outputs.version }}
