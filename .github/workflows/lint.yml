name: Lint
on: [push, pull_request]

permissions: {}

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      with:
        persist-credentials: false

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
      with:
        go-version-file: 'go.mod'

    # Build against a newer x/tools so it can read Go 1.27.2 export data.
    # Once staticcheck releases a fix (https://github.com/dominikh/go-tools/issues/1832),
    # replace this step with: go install honnef.co/go/tools/cmd/staticcheck@<fixed version>
    - name: Install staticcheck
      run: |
        mkdir -p "$RUNNER_TEMP/staticcheck" && cd "$RUNNER_TEMP/staticcheck"
        go mod init staticcheck
        go mod edit -go=1.27.2
        go get honnef.co/go/tools/cmd/staticcheck@v0.8.1 golang.org/x/tools@v0.51.0
        go build -o "$(go env GOPATH)/bin/staticcheck" honnef.co/go/tools/cmd/staticcheck

    - name: Run staticcheck
      run: |
        staticcheck ./...

    - name: Run govulncheck
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
        govulncheck ./...
